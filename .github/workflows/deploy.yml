name: Validate dashboard and deploy when Pages is enabled

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 openpyxl==3.1.5
      - name: Rebuild dashboard from approved source workbooks
        run: npm run data:build
      - run: npm run lint
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-dashboard
          path: dist
  deploy:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-dashboard
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
